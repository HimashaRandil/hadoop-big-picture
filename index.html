<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hadoop: the big picture — how every piece works together</title>
<style>
:root{
  --bg:#0E1524; --bg2:#141E33; --panel:#18233B; --line:#2C3B5C; --text:#E8EDF6; --muted:#9AA8C2;
  --hdfs:#F2A93B; --yarn:#4FA3F7; --mr:#7BD389; --hive:#E86FB0; --hbase:#F26B5B; --kafka:#B392F0;
  --zk:#5FD3C8; --ingest:#F5D547; --spark:#FF8A3D; --client:#9AA7BD; --azure:#3BA3FF; --red:#FF5A5A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{display:flex;flex-direction:column;height:100vh;min-height:640px}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header h1 span{color:var(--muted);font-weight:500;font-size:14px;margin-left:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:0;padding:7px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:#25365A;color:var(--text)}
.spacer{flex:1}
.btn{background:#22314F;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer}
.btn:hover{background:#2A3C61}
#main{flex:1;display:flex;min-height:0}
#stageWrap{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(ellipse at 50% 40%,#132038 0%,#0E1524 70%)}
#stageArea{flex:1;position:relative;min-height:0}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#panel{width:340px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px}
#filters{display:flex;gap:6px;padding:7px 16px;border-top:1px solid var(--line);background:var(--bg2);flex-wrap:nowrap;overflow-x:auto;align-items:center}
#filters .chipf{flex:none}
#panel.hide{display:none}
#filters .lbl{color:var(--muted);font-size:12px;margin-right:4px}
.chipf{border:1px solid var(--line);background:#1B2742;color:var(--text);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chipf i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chipf.on{outline:2px solid #fff3}
footer{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);background:#101A2E;flex-wrap:wrap}
footer .pbtn{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:#22314F;color:#fff;font-size:16px;cursor:pointer}
footer .pbtn.big{width:52px;background:#2F6BD8;border-color:#2F6BD8}
#timeline{flex:1;display:flex;gap:3px;min-width:260px;height:36px;align-items:stretch}
#timeline .ts{flex:1;background:#1E2A45;border-radius:5px;cursor:pointer;position:relative;overflow:hidden;border:1px solid #2A3A5E}
#timeline .ts.done{background:#2C4A7C}
#timeline .ts.cur{background:#3B6FD0;border-color:#8FB4FF}
#timeline .ts.cloud{border-bottom:3px solid var(--azure)}
#timeline .ts:hover::after{content:attr(data-t);position:absolute;left:4px;top:9px;font-size:11px;color:#fff;white-space:nowrap}
footer label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
footer select{background:#1B2742;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px}
#sceneTag{position:absolute;left:16px;top:12px;background:#0B1220CC;border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:60%}
#sceneTag .ch{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
#sceneTag .tt{font-size:17px;font-weight:700;margin-top:2px}
#caption{flex:none;margin:0 14px 10px;background:#070C17;border:1px solid #33456B;border-radius:12px;padding:12px 18px;font-size:18px;line-height:1.45;text-align:center;min-height:82px}
#caption .hint{display:block;font-size:12px;color:var(--muted);margin-top:6px}
#cards{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.card{background:#0B1220F0;border:1px solid #3A4E78;border-radius:10px;padding:10px 13px;font-size:13px;min-width:220px;max-width:330px;box-shadow:0 6px 20px #0007}
.card h4{margin:0 0 6px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.card .big{font-size:24px;font-weight:800}
.card table{border-collapse:collapse;width:100%}
.card td{padding:2px 4px;font-size:13px}
.meter{height:10px;background:#1F2B46;border-radius:6px;overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;background:var(--ingest);width:0}
.dag{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dag span{padding:4px 8px;border-radius:7px;border:1px solid #4A5D85;font-size:12px}
.dag span.run{background:#2F6BD8;border-color:#8FB4FF}
.dag span.ok{background:#215C3A;border-color:#7BD389}
#legend{position:absolute;left:16px;bottom:96px;background:#0B1220F2;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;display:none;max-width:420px}
#legend.show{display:block}
#legend .row{display:flex;gap:10px;align-items:center;margin:6px 0}
#legend svg{flex:none}
/* panel */
#panel h2{font-size:20px;margin:4px 0 4px}
#panel .kind{display:inline-block;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#25365A;color:#CFE0FF;margin-bottom:8px}
#panel .kind.machine{background:#39465F;color:#E6ECF7}
#panel .kind.daemon{background:#1E4D3A;color:#B8F2CF}
#panel .kind.task{background:#4A3B12;color:#FFE7A3}
#panel .kind.data{background:#4D2F12;color:#FFD3A1}
#panel .kind.net{background:#2A2F45;color:#C9D2EA}
#panel .kind.svc{background:#123A63;color:#BFE0FF}
#panel p{font-size:14px;line-height:1.5;color:#D8E0EE;margin:8px 0}
#panel dl{margin:10px 0;font-size:13.5px}
#panel dt{color:var(--muted);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;margin-top:10px}
#panel dd{margin:3px 0 0;line-height:1.45}
#panel ul{margin:4px 0 0 18px;padding:0}
#panel li{margin:3px 0;font-size:13.5px;line-height:1.4}
#panel .analogy{background:#1D2C4B;border-left:4px solid #4FA3F7;border-radius:8px;padding:9px 11px;font-size:13.5px;margin:12px 0}
#panel .goto{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#panel .goto button{background:#22314F;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
#panel .close{float:right}
#panel .scenelist{list-style:none;margin:8px 0 0;padding:0}
#panel .scenelist li{padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13.5px;display:flex;gap:8px}
#panel .scenelist li:hover{background:#22314F}
#panel .scenelist li.cur{background:#2B4373}
#panel .scenelist li b{color:var(--muted);font-weight:600;width:22px;flex:none}
#panel .transcript{font-size:13px;color:#C9D3E6;border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
#panel .transcript div{margin:6px 0;line-height:1.4}
#panel .transcript div.now{color:#fff}
/* svg */
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.rack{fill:#121C30;stroke:#26375A;stroke-width:1.5}
.racktitle{fill:#7F8EAD;font-size:15px;letter-spacing:1.6px;font-weight:700;text-transform:uppercase}
.mach rect.body{fill:#1A2540;stroke:#3A4D75;stroke-width:1.6}
.mach text.t{fill:#F2F5FB;font-size:17px;font-weight:700}
.mach text.s{fill:#8E9CB8;font-size:13px}
.mach .ico{fill:#55688F}
.mach.dead rect.body{stroke:var(--red);fill:#2A1620}
.mach.dead text.t{fill:#FF9C9C}
.mach.off{opacity:.08}
.proc rect{rx:6;stroke-width:1.3}
.proc text{font-size:14px;font-weight:600}
.proc.dead rect{fill:#2A2F3A!important;stroke:#555!important}
.proc.dead text{fill:#777!important;text-decoration:line-through}
.proc.glow rect{filter:url(#glow)}
.netl{stroke:#2E4066;stroke-width:2;fill:none}
.netcore{fill:#22304F;stroke:#4A6190}
.nettext{fill:#8FA0C2;font-size:13px;font-weight:600}
.slot{fill:none;stroke:#2C3B5C;stroke-dasharray:4 3}
.cont rect{stroke-width:1.6;stroke-dasharray:5 3}
.cont text{font-size:13px;font-weight:700}
.blk rect{rx:4}
.blk text{font-size:12.5px;font-weight:800}
.lbl2{fill:#7887A6;font-size:12.5px}
.dim{opacity:.22;transition:opacity .35s}
.focusable{transition:opacity .35s}
.pkt text{font-size:15px;font-weight:700;paint-order:stroke;stroke:#0E1524;stroke-width:4px}
.clickable{cursor:pointer}
.clickable:hover rect.body{stroke:#8FB4FF}
.proc.clickable:hover rect{stroke:#fff}
.xmark{stroke:var(--red);stroke-width:5;stroke-linecap:round}
.frame{fill:none;stroke:#3BA3FF;stroke-width:2;stroke-dasharray:8 6}
.frametitle{fill:#8CC6FF;font-size:15px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.store rect.body{fill:#13304F;stroke:#3BA3FF}
.glow{filter:url(#glow)}
.off{opacity:.06!important}
kbd{background:#22314F;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
@media (max-width:1100px){#panel{width:300px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Hadoop — the big picture <span>which programs run on which machines, and how they work together</span></h1>
    <div class="spacer"></div>
    <div class="seg" id="modeSeg"><button data-m="watch" class="on">▶ Watch the story</button><button data-m="explore">🔍 Explore freely</button></div>
    <div class="seg" id="worldSeg"><button data-w="onprem" class="on">On-premises cluster</button><button data-w="cloud">Azure HDInsight</button></div>
    <button class="btn" id="legendBtn">Legend</button>
    <button class="btn" id="panelBtn">Hide panel</button>
  </header>
  <div id="main">
    <div id="stageWrap">
      <div id="stageArea">
      <svg id="stage" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet" aria-label="Map of a Hadoop cluster: racks of machines and the programs running on them"></svg>
      <div id="sceneTag"><div class="ch" id="chTxt"></div><div class="tt" id="ttTxt"></div></div>
      <div id="cards"></div>
      <div id="legend"></div>
      </div>
      <div id="caption"></div>
    </div>
    <aside id="panel"></aside>
  </div>
  <div id="filters"><span class="lbl" style="flex:none;white-space:nowrap">Highlight a system:</span></div>
  <footer>
    <button class="pbtn" id="prevBtn" title="Previous scene">⏮</button>
    <button class="pbtn big" id="playBtn" title="Play / pause (space)">⏸</button>
    <button class="pbtn" id="nextBtn" title="Next scene">⏭</button>
    <div id="timeline"></div>
    <label>Speed <select id="speedSel"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
    <label title="Waits for you after every sentence: press → or click the caption to continue"><input type="checkbox" id="stepChk"> Lecture mode (pause after each sentence)</label>
  </footer>
</div>

<script>
"use strict";
/* =====================================================================
   1. SYSTEMS, COLOURS
   ===================================================================== */
const SYS = {
  hdfs:{name:"HDFS (storage)", c:"#F2A93B"},
  yarn:{name:"YARN (resources)", c:"#4FA3F7"},
  mr:{name:"MapReduce / Tez tasks", c:"#7BD389"},
  hive:{name:"Hive (SQL)", c:"#E86FB0"},
  hbase:{name:"HBase (NoSQL)", c:"#F26B5B"},
  kafka:{name:"Kafka (streams)", c:"#B392F0"},
  zk:{name:"ZooKeeper (coordination)", c:"#5FD3C8"},
  spark:{name:"Spark", c:"#FF8A3D"},
  ingest:{name:"Sqoop · Flume · Oozie", c:"#F5D547"},
  client:{name:"Clients & sources", c:"#9AA7BD"},
  azure:{name:"Azure services", c:"#3BA3FF"}
};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("stage");
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in (attrs||{})) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function txt(parent,x,y,s,cls,extra){ const t=el("text",Object.assign({x,y,class:cls||""},extra||{}),parent); t.textContent=s; return t; }
function shade(hex,a){ return hex + Math.round(a*255).toString(16).padStart(2,"0"); }

/* =====================================================================
   2. INFORMATION FOR EVERY COMPONENT (deep dives)
   kind: machine | daemon | task | data | net | svc
   ===================================================================== */
const INFO = {
 laptop:{title:"Your laptop", kind:"machine", sys:"client", what:"Your own computer. It is NOT part of the cluster. It only sends requests over the network: SQL through Beeline or Power BI, or file commands with the hdfs client.", runs:"Beeline (Hive client), the hdfs command-line client, Power BI.", talks:["HiveServer2 on the utility node (SQL)","NameNode (asks where blocks are)","DataNodes (sends and receives the actual bytes)"], fails:"Nothing in the cluster cares. Your query is simply cancelled.", analogy:"A customer standing at the library's front desk: asks questions, never walks into the stacks.", scenes:["write","read","hive"]},
 web:{title:"Web servers", kind:"machine", sys:"client", what:"The company's ordinary web servers. They are outside the Hadoop cluster and write a log line for every click and error.", runs:"The website; it produces log events.", talks:["The Flume agent on the edge node (sends log events)"], fails:"Logs stop arriving; the cluster keeps running.", analogy:"Shops that write a receipt for every sale.", scenes:["ingest"]},
 apps:{title:"App servers", kind:"machine", sys:"client", what:"Application servers (e.g. the mobile app's back end). They publish events to Kafka and read/write single rows in HBase.", runs:"A Kafka producer library, an HBase client library.", talks:["Kafka brokers","ZooKeeper (to find hbase:meta)","HBase RegionServers"], fails:"No new events or lookups; the cluster is unaffected.", analogy:"The cashiers who both shout updates into a megaphone (Kafka) and look up one customer's card (HBase).", scenes:["kafka","hbase"]},
 mysqlsrv:{title:"MySQL server (orders database)", kind:"machine", sys:"client", what:"The company's normal relational database for day-to-day orders. It lives outside Hadoop. Sqoop copies its tables into HDFS for analysis.", runs:"MySQL.", talks:["Sqoop's map tasks (each reads one slice of the table over JDBC)"], fails:"The import fails and Oozie raises an alert.", analogy:"The shop's till system. Analysts get a photocopy of it, not the till itself.", scenes:["ingest"]},
 master:{title:"Master node", kind:"machine", sys:"hdfs", what:"A server dedicated to 'brain' programs: they keep metadata and make decisions. Master nodes hold NO user data blocks. Small clusters have 3 masters so every critical service has a backup and ZooKeeper has a majority.", runs:"See the coloured programs inside: NameNode (active or standby), ZKFC, JournalNode, ZooKeeper, ResourceManager, HMaster.", talks:["Every worker (heartbeats come in)","Each other (ZooKeeper, JournalNodes)"], fails:"Its services fail over to their standby on another master (see the scene 'When a master dies').", analogy:"Head office: the catalogue and the managers, but no warehouse shelves.", scenes:["boot","failover"]},
 utility:{title:"Utility node", kind:"machine", sys:"hive", what:"A server for shared services that are not core HDFS/YARN masters: Hive's front desk (HiveServer2), the Hive Metastore service and its database, and the Oozie scheduler. Many companies put these on a master node instead; the idea is the same.", runs:"HiveServer2, Hive Metastore service, MySQL (metastore database), Oozie server.", talks:["Clients (SQL in, results out)","ResourceManager (submits Tez jobs)","Workers (Tez tasks report back)"], fails:"SQL access stops until it restarts or a second HiveServer2 takes over. No data is lost: it never stored the data.", analogy:"The library's information desk and card catalogue.", scenes:["hive","oozie"]},
 edge:{title:"Edge node (gateway node)", kind:"machine", sys:"client", what:"The door into the cluster for people and tools. Users SSH in here and run client programs, so nobody runs ad-hoc jobs on the masters. It stores no HDFS blocks and runs no YARN containers.", runs:"hdfs / yarn / beeline clients, spark-submit, the Sqoop client, a Flume agent (collector).", talks:["ResourceManager (job submission)","NameNode and DataNodes (as an HDFS client)","MySQL and web servers (ingestion)"], fails:"Users lose their entry point; running jobs continue on the workers.", analogy:"The staff entrance with the tool room.", scenes:["mr","ingest","kafka"]},
 worker:{title:"Worker node", kind:"machine", sys:"yarn", what:"The workhorse. Lots of disks (for HDFS blocks) and lots of CPU and memory (for YARN containers). Every worker runs the same daemons: a DataNode, a NodeManager and an HBase RegionServer. You scale the cluster by adding workers.", runs:"Always: DataNode, NodeManager, RegionServer. Temporarily: containers with map/reduce/Tez/Spark/Sqoop tasks.", talks:["NameNode (heartbeat every 3 s)","ResourceManager (heartbeat about every 1 s)","Other workers (replication pipelines, shuffle)"], fails:"Its blocks are re-copied elsewhere after ~10.5 min; its running tasks are re-run elsewhere by each job's ApplicationMaster.", analogy:"A branch that both stores goods and has workbenches to process them.", scenes:["intro","write","fail","mr"]},
 broker:{title:"Kafka broker machine", kind:"machine", sys:"kafka", what:"A server running a Kafka broker. Kafka usually gets its own machines because it does constant disk and network I/O. Each broker stores some partitions of each topic on its disks.", runs:"Kafka broker (a Java program).", talks:["Producers (append events)","Other brokers (followers copy from leaders)","Consumers (read events)"], fails:"For partitions it led, a follower on another broker becomes leader; producers and consumers switch over.", analogy:"A post office sorting room that keeps a copy of every letter for a week.", scenes:["kafka"]},
 tor:{title:"Top-of-rack (ToR) switch", kind:"net", sys:"client", what:"Every rack has a network switch at the top. Machines in the same rack talk through it directly. Traffic to another rack must go up to the core switch and down again, which is why HDFS and YARN prefer 'same node, then same rack'.", runs:"—", talks:["Every machine in its rack","The core switch"], fails:"The whole rack becomes unreachable, which is exactly why HDFS keeps copies on 2 racks.", analogy:"The corridor of one building.", scenes:["intro","write"]},
 core:{title:"Core switch", kind:"net", sys:"client", what:"Connects all racks together (and to the outside world through a firewall). Cross-rack bandwidth is the scarcest resource in a classic cluster.", runs:"—", talks:["All top-of-rack switches"], fails:"Real clusters have redundant core switches.", analogy:"The main road between buildings.", scenes:["intro","mr"]},

 namenode:{title:"NameNode", kind:"daemon", sys:"hdfs", what:"The HDFS master program. It keeps the whole namespace (folders, files, permissions) and the block map (which blocks make up each file and which DataNodes hold them) in memory. It never stores or transfers file data: clients get addresses from it and talk to DataNodes directly.", runs:"Master 1 (active) and Master 2 (standby).", talks:["Clients (metadata questions)","DataNodes (heartbeats every 3 s, block reports)","JournalNodes (writes every change to the edit log)","its ZKFC"], nums:["Default block size 128 MB","3 copies per block","Heartbeat 3 s · stale after 30 s · dead after 630 s"], fails:"With HA, the standby takes over in seconds (ZooKeeper + ZKFC). Without HA, the whole file system is unavailable until it restarts.", analogy:"The library catalogue: it knows where every page is, but never carries books.", scenes:["write","read","fail","failover"]},
 zkfc:{title:"ZKFC (ZooKeeper Failover Controller)", kind:"daemon", sys:"hdfs", what:"A small program next to each NameNode. It health-checks its NameNode and holds a session with ZooKeeper. The ZKFC whose NameNode is active holds the 'active' lock. If the active NameNode dies, the other ZKFC grabs the lock and promotes its own NameNode. Fencing makes sure the old one can never write again: with the Quorum Journal Manager, the JournalNodes accept edits only from the NameNode with the newest 'epoch'.", runs:"Master 1 and Master 2 (one beside each NameNode).", talks:["Its local NameNode","ZooKeeper"], fails:"If a ZKFC dies, its lock is released, which triggers a failover.", analogy:"A bodyguard who holds the 'manager on duty' badge.", scenes:["boot","failover"]},
 journalnode:{title:"JournalNode", kind:"daemon", sys:"hdfs", what:"Stores the NameNode's edit log (every create, rename, delete). The active NameNode writes each change to a majority of the JournalNodes; the standby keeps reading them so it is always up to date.", runs:"Masters 1, 2 and 3 (three JournalNodes, so the log survives one failure).", talks:["Active NameNode (writes)","Standby NameNode (reads)"], nums:["3 (or 5) JournalNodes; a write needs a majority"], fails:"With 3 JournalNodes, losing 1 is fine; losing 2 stops metadata changes.", analogy:"Three notebooks where every catalogue change is written down.", scenes:["failover"]},
 zookeeper:{title:"ZooKeeper server", kind:"daemon", sys:"zk", what:"A small, very reliable coordination service. It stores tiny pieces of shared state (znodes): who is the active NameNode or ResourceManager, where HBase's meta table is, which servers are alive. Servers form an ensemble that elects a leader; every change needs a majority.", runs:"Masters 1, 2 and 3 (three servers form one ensemble).", talks:["ZKFCs","ResourceManagers","HBase (HMaster, RegionServers, clients)","HiveServer2 (service discovery)"], nums:["3 servers survive 1 failure; 5 survive 2","Ephemeral znodes vanish when their owner's session dies"], fails:"One server down: nothing visible. Majority down: failovers and HBase stop working.", analogy:"The referee everyone trusts to say who is captain.", scenes:["boot","hbase","failover"]},
 resourcemanager:{title:"ResourceManager (YARN)", kind:"daemon", sys:"yarn", what:"The YARN master. Its Scheduler decides which application gets how much CPU and memory, on which node, using queues and capacity rules. Its ApplicationsManager accepts jobs and starts each job's ApplicationMaster. It never runs tasks itself.", runs:"Master 3 (active) and Master 2 (standby, via ZooKeeper).", talks:["Clients (job submission)","NodeManagers (heartbeats, about every 1 s)","ApplicationMasters (container requests)"], fails:"The standby takes over; with work-preserving recovery, running containers continue.", analogy:"Head office that allocates workbenches to projects.", scenes:["mr","hive","kafka","ingest"]},
 hmaster:{title:"HMaster (HBase master)", kind:"daemon", sys:"hbase", what:"Assigns HBase regions to RegionServers, balances them, handles splits and table changes (create/alter). It is NOT in the read/write path: clients talk to RegionServers directly.", runs:"Master 3 (a standby HMaster usually runs on another master).", talks:["ZooKeeper","RegionServers"], fails:"Reads and writes continue; only region moves and table changes wait.", analogy:"The manager who decides which clerk owns which drawer of the filing cabinet.", scenes:["hbase"]},
 hiveserver2:{title:"HiveServer2", kind:"daemon", sys:"hive", what:"Hive's front desk. A Java program that accepts SQL over JDBC/ODBC (from Beeline, Power BI, apps). Inside it, the compiler checks the query against the Metastore, the optimizer builds a plan (a DAG), and the plan is submitted to YARN as a Tez job. Only the small final result comes back through it.", runs:"The utility node here (on HDInsight: the head nodes).", talks:["Clients","Hive Metastore service","ResourceManager","Tez ApplicationMaster"], fails:"Queries fail until it restarts or another HiveServer2 instance (registered in ZooKeeper) takes over. Data is untouched.", analogy:"The librarian at the desk: reads your question, checks the catalogue, sends helpers to the shelves.", scenes:["hive","oozie"]},
 hms:{title:"Hive Metastore service", kind:"daemon", sys:"hive", what:"A service that answers 'what does this table look like?': columns, types, partitions and the storage location of the files. Hive, Spark and other engines all ask it. It stores the answers in a relational database.", runs:"The utility node.", talks:["HiveServer2 (and Spark)","The metastore database"], fails:"New queries cannot be compiled. Files are untouched.", analogy:"The card catalogue clerk.", scenes:["hive"]},

 sqoopcli:{title:"Sqoop client", kind:"daemon", sys:"ingest", what:"A command-line tool (not a long-running service). 'sqoop import' reads MIN and MAX of the split column, cuts the range into slices (4 by default) and submits a map-only YARN job; each map task reads one slice from the database over JDBC and writes it to HDFS. (Retired 2021; Azure Data Factory and Spark JDBC use the same idea.)", runs:"The edge node.", talks:["MySQL","ResourceManager"], fails:"The import fails; rerun it.", analogy:"A removal company that sends 4 vans to 4 rooms at once.", scenes:["ingest"]},
 flume:{title:"Flume agent", kind:"daemon", sys:"ingest", what:"A Java program with three parts: a Source receives events, a Channel buffers them (memory = fast, file = survives a crash), an HDFS Sink appends batches to an open file and rolls to a new file by time, size or event count. Tuned well (e.g. roll at ~128 MB), HDFS gets a few large files instead of millions of tiny ones; the defaults (30 s, 1 KB, 10 events) produce small files. Agents often run on the web servers themselves or on a collector node like this one. (Marked dormant in 2024; Kafka usually does this today.)", runs:"The edge node (as a collector).", talks:["Web servers (events in)","NameNode and DataNodes (as an HDFS client)"], fails:"With a file channel, buffered events survive a restart.", analogy:"A mail sack that is only taken to the post office when it's full.", scenes:["ingest"]},

 regionserver:{title:"HBase RegionServer", kind:"daemon", sys:"hbase", what:"Serves HBase regions (contiguous ranges of row keys). A write goes first to the write-ahead log (WAL, stored in HDFS) and then into the MemStore in memory; full MemStores are flushed to HFiles in HDFS. It runs on the same machines as the DataNodes so its HFiles are usually local.", runs:"Every worker.", talks:["Clients (gets and puts)","ZooKeeper","DataNodes (WAL and HFiles)"], nums:["Typical lookups take milliseconds"], fails:"Its regions are reassigned by the HMaster; the WAL is replayed so no acknowledged write is lost.", analogy:"A clerk who owns a few drawers of a giant sorted filing cabinet.", scenes:["hbase"]},

function Pq(a,b,o){ return quiet(P(a,b,o)); } // fire and forget
async function pipe(src,dns,label,o){
  o=o||{}; const fast=o.fast; const cls=o.cls||"blk"; const v=fast?1100:640;
  let prev=src;
  for(const dn of dns){ await P(prev,dn,{c:o.c||"data",big:true,label:fast?"":(prev===src?label+" packets":"forward"),v}); addBlock(NODES[dn].machine,label,cls); prev=dn; }
  if(o.noack) return;
  const back=[...dns].reverse(); back.push(src);
  for(let i=0;i<back.length-1;i++) await P(back[i],back[i+1],{c:"ack",label:fast||i>0?"":"ack",v:v*1.5});
}

  const mc=card("mem","<h4>Worker 1 · MemStore (memory)</h4><div class='meter'><b id='memb' style='background:#F26B5B'></b></div>");
  await tween(0.6,p=>document.getElementById("memb").style.width=(10*p)+"%");
  await P("rs_w1","hbclient",{c:"hbase",label:"done"});
  await say("Step 4: the RegionServer first appends the change to its <b>write-ahead log</b> (an HDFS file, so 3 copies that survive a crash), then puts the row in the <b>MemStore</b> in memory, and replies 'done'.");
  await tween(1.6,p=>document.getElementById("memb").style.width=(10+90*p)+"%");
  await pipe("rs_w1",["dn_w1","dn_w4","dn_w6"],"HFile",{cls:"hfile",fast:true,c:"hbase"}); document.getElementById("memb").style.width="0%";
  await say("Later, when the MemStore fills up, it is flushed to an <b>HFile</b>: again an HDFS file, first copy on Worker 1's own disk.");
  F("hmaster","rs_w1","rs_w4","rs_w6"); await say("That's why HBase lookups take milliseconds: sorted row keys tell the client exactly which server to ask, and recent data is served from memory. The HMaster only decides which RegionServer owns which region.");
}},
{id:"kafka", ch:"7 · Kafka + Spark", title:"A live stream of events", world:"onprem", async run(){
  base(); F("producer","kb1","kb2","kb3");
  await say("App servers publish every call event to the Kafka topic <b>calls</b>. It has 3 partitions; each has a <b>leader</b> on one broker and a <b>follower</b> copy on another.");
  for(let r=0;r<2;r++) await all(P("producer","kb1",{c:"kafka",label:r?"":"→ P0"}),P("producer","kb2",{c:"kafka",label:r?"":"→ P1"}),P("producer","kb3",{c:"kafka",label:r?"":"→ P2"}));
  await all(P("kb1","kb2",{c:"kafka",label:"follower copies P0"}),P("kb2","kb3",{c:"kafka"}),P("kb3","kb1",{c:"kafka"}));
  await say("The producer hashes each event's key (the caller ID) to pick a partition, so one caller's events always stay in order. Followers copy from leaders, so a broker can die without losing events.");
  F("sparksubmit","rm1"); await P("sparksubmit","rm1",{c:"spark",label:"start streaming app"});
  const drv=addCont("w5","Spark driver","sdrv"); const ex=[addCont("w1","executor","sexec"),addCont("w4","executor","sexec"),addCont("w6","executor","sexec")];
  F(drv,ex,"kb1","kb2","kb3");
  await say("To process the stream, someone runs <b>spark-submit</b> on the edge node. YARN starts the Spark driver inside the application's AM container on Worker 5, and three <b>executors</b> in containers on other workers.");
  for(let r=0;r<3;r++) await all(P("kb1",ex[0],{c:"kafka",label:r?"":"P0"}),P("kb2",ex[1],{c:"kafka",label:r?"":"P1"}),P("kb3",ex[2],{c:"kafka",label:r?"":"P2"}));
  await say("The Spark <b>driver</b> keeps track of offsets: each micro-batch it gives every executor a range of offsets in one partition, and records its progress in its own checkpoint. (Ordinary Kafka consumers would instead share the partitions as a <b>consumer group</b> and commit offsets to Kafka.) Kafka keeps events for 7 days by default, so a consumer can rewind and replay.");
  await all(...ex.map((e,i)=>P(e,"dn_"+["w1","w4","w6"][i],{c:"spark",label:i?"":"write results"}).then(()=>addBlock(["w1","w4","w6"][i],"agg","sp"))));
  await say("Each micro-batch's results land in HDFS. Notice where everything runs: Kafka on its own machines, Spark only inside YARN containers on the workers.");
  [drv,...ex].forEach(removeCont);
}},
{id:"ingest", ch:"8 · Ingestion", title:"Bringing data in: Sqoop and Flume", world:"onprem", async run(){
  base(); card("sq","<h4>sqoop import</h4>--table orders --split-by id -m 4");
  F("sqoopcli","ordersdb"); await P("sqoopcli","ordersdb",{c:"ingest",label:"SELECT MIN(id), MAX(id)"}); await P("ordersdb","sqoopcli",{c:"ingest",label:"1 … 100,000"});
  await say("<b>Sqoop</b> (on the edge node) first asks MySQL for the range of the split column: ids 1 to 100,000. With 4 mappers (the default) that's 4 slices of 25,000 ids.");
  await P("sqoopcli","rm1",{c:"yarn",label:"map-only job"});
  const am=addCont("w3","AM","am"); const ws=["w1","w2","w4","w6"]; const ms=ws.map((w,i)=>addCont(w,"Sqoop map "+(i+1),"sqmap"));
  F(ms,am,"ordersdb"); await say("It submits a <b>map-only</b> job: YARN starts an ApplicationMaster and four map containers. No reducers.");
  const rng=["1–25k","25k–50k","50k–75k","75k–100k"];
  await all(...ms.map((m,i)=>P("ordersdb",m,{c:"ingest",big:true,label:rng[i]})));
  await say("Each map task opens its own database connection and pulls its slice: four reads at once.");
  await all(...ms.map((m,i)=>P(m,"dn_"+ws[i],{c:"ingest"}).then(()=>addBlock(ws[i],"m-"+i,"sq"))));
  await say("Each writes its rows to HDFS as part-m-0000N (HDFS then replicates them as usual).");
  [...ms,am].forEach(removeCont); uncard("sq");
  F("webapp","flume"); card("fl","<h4>Flume agent · channel buffer</h4><div class='meter'><b id='flb'></b></div><div id='flt'>0 events</div>");
  let n=0;
  for(let r=0;r<6;r++){ Pq("webapp","flume",{c:"ingest",faint:false,v:1000}); await sleep(0.18); Pq("webapp","flume",{c:"ingest",v:1000}); await sleep(0.18); n+=2; document.getElementById("flb").style.width=(n*8.3)+"%"; document.getElementById("flt").textContent=n+" … events"; }
  await say("Meanwhile the web servers send a constant drizzle of tiny log events (about 1 KB each) to the <b>Flume</b> agent. Its Source receives them and its Channel buffers them.");
  F("flume","dn_w2","dn_w5","dn_w4"); await pipe("flume",["dn_w2","dn_w5","dn_w4"],"log",{cls:"log",fast:true,c:"ingest"});
  document.getElementById("flb").style.width="0%"; document.getElementById("flt").textContent="buffer flushed";
  await say("The HDFS Sink appends batches to an open file and only <b>rolls</b> to a new file by time, size or event count. Tuned to roll at about 128 MB, a million 1 KB events become about 8 large files instead of a million tiny ones that would swamp the NameNode's memory. (The defaults roll every 30 s or 1 KB, so they must be tuned.)");
}},
{id:"oozie", ch:"9 · Orchestration", title:"01:00: the nightly workflow", world:"onprem", async run(){
  base();
  const dag=()=>"<h4>Oozie workflow · 01:00</h4><div class='dag'><span id='d1'>sqoop-import</span>→<span id='d2'>hive-transform</span>→<span id='d3'>export</span></div>";
  card("dag",dag()); const st=(i,c)=>document.getElementById("d"+i).className=c;
  F("oozie"); await say("At 01:00 the <b>Oozie</b> coordinator on the utility node checks that today's input folder exists, then starts the nightly workflow.");
  st(1,"run"); F("oozie","rm1"); await P("oozie","rm1",{c:"ingest",label:"launch sqoop-import"});
  let cs=["w1","w2","w4","w6"].map(w=>addCont(w,"Sqoop map","sqmap")); await sleep(1.5); cs.forEach(removeCont); st(1,"ok");
  st(2,"run"); F("oozie","hs2","rm1"); await P("oozie","hs2",{c:"ingest",label:"run hive-transform.sql"}); await P("hs2","rm1",{c:"yarn",label:"Tez job"});
  cs=["w1","w3","w5"].map(w=>addCont(w,"Tez task","tez")); await sleep(1.5); cs.forEach(removeCont); st(2,"ok");
  st(3,"run"); await P("oozie","rm1",{c:"ingest",label:"launch export"}); cs=[addCont("w4","export","sqmap")]; await sleep(1); cs.forEach(removeCont); st(3,"ok");
  F("oozie"); await say("Every action ran as its own YARN job on the workers. Oozie itself processed nothing: it waited, launched, and recorded each result. (Oozie is retired now; Airflow or Azure Data Factory play this role today.)");
}},
{id:"failover", ch:"10 · High availability", title:"When a master dies", world:"onprem", async run(){
  base(); F("m1"); await say("Now <b>Master 1</b>, the machine running the active NameNode, crashes.");
  setDead("m1",true); activeNN="nn2";
  F("zk2","zk3","zkfc2"); await say("Its ZooKeeper session stops being renewed. When the session times out, ZooKeeper deletes the 'active' lock. ZooKeeper itself is fine: Masters 2 and 3 are still a majority.");
  await P("zk3","zkfc2",{c:"zk",label:"lock released"}); await P("zkfc2","zk3",{c:"zk",label:"take the lock"});
  F("zkfc2","nn2","jn2","jn3"); await P("zkfc2","nn2",{c:"ctrl",label:"become active"}); await all(P("nn2","jn2",{c:"ctrl",label:"new epoch"}),P("nn2","jn3",{c:"ctrl"}));
  await all(P("jn2","nn2",{c:"data",label:"latest edits"}),P("jn3","nn2",{c:"data"}));
  setLabel("nn2","NameNode · active"); setLabel("nn1","NameNode · down"); glow("nn2");
  await say("Master 2's ZKFC grabs the lock and promotes its own NameNode. The new NameNode claims a higher 'epoch' on the JournalNodes, which from then on accept edits only from it. That is the <b>fencing</b>: even if the old NameNode woke up, it could never write again. The new one is already up to date: it has been reading every change from the JournalNodes, and 2 of 3 are still alive.");
  glow("nn2",false); F(DNS,"nn2");
  await say("The DataNodes were reporting to <b>both</b> NameNodes all along, so the new active one already knows where every block is. Clients retry and carry on: a short pause, no data lost.");
}},
{id:"cloud1", ch:"11 · Azure HDInsight", title:"The same ideas in the cloud", world:"cloud", async run(){
  cbase(); F("c_adls"); await say("Now Azure HDInsight. The biggest change: the data no longer lives on worker disks. It lives in an <b>Azure Storage account</b>, a service that exists on its own. For clusters you create yourself that is usually <b>ADLS Gen2</b> (abfss:// paths), which plays the role of HDFS.");
  F(CMACH.filter(m=>m.cluster).map(m=>m.id)); await say("The cluster (gateways, two head nodes, three ZooKeeper nodes and the workers) is a set of virtual machines Azure creates for you. You can delete it at any time.");
  F("c_h0","c_h1"); await say("Same programs, new homes: <b>HiveServer2</b> runs on both head nodes, the <b>ResourceManager</b> is active on one and standby on the other, NodeManagers run on the workers, and ZooKeeper on its own small nodes.");
  F("c_sql"); await say("Table definitions live in an <b>external Hive metastore</b> in Azure SQL Database, outside the cluster, so they survive too.");
  F("c_gw1","c_gw2","c_laptop"); await say("Web, REST and JDBC traffic (Ambari, Beeline, Power BI) comes in through the HTTPS <b>gateways</b> at clustername.azurehdinsight.net. SSH is the exception: it goes straight to a head node or the edge node.");
  F(); await say("Next: the cost-saving pattern, where the cluster exists only while there is work to do.");
}},
{id:"cloud2", ch:"11 · Azure HDInsight", title:"01:00: Data Factory creates the cluster", world:"cloud", async run(){
  cbase(); clusterVisible(false); F("c_adf","c_bill","c_adls");
  card("clk","<h4>Clock</h4><div class='big' id='cclk'>00:59</div>");
  await say("Night time. There is no cluster at all, so the compute meter is stopped. Only the storage account (and its files) exists.");
  document.getElementById("cclk").textContent="01:00"; F("c_adf","c_bill");
  await say("01:00: a schedule trigger in <b>Azure Data Factory</b> starts the nightly pipeline, which asks Azure to create an <b>on-demand</b> HDInsight cluster.");
  F("c_adls"); await say("One catch: an on-demand cluster that ADF creates must use <b>Blob storage</b> (wasbs:// paths), not ADLS Gen2. So tonight's files sit in a Blob container in the storage account. It is the same idea: permanent storage outside the cluster.");
  CSTORE.billS.textContent="cluster exists — billed per minute, even when idle";
  await all(clusterFade(true,4), tween(4,p=>{ setBill(20*p); document.getElementById("cclk").textContent="01:"+String(Math.round(20*p)).padStart(2,"0"); }));
  F(); await say("Provisioning takes about 20 minutes. From the moment the cluster exists, compute is billed <b>per minute</b>.");
}},
{id:"cloud3", ch:"11 · Azure HDInsight", title:"The job runs against cloud storage", world:"cloud", async run(){
  cbase(); setBill(20); CSTORE.billS.textContent="cluster exists — billed per minute, even when idle";
  const bill=(async()=>{ try{ for(;;){ await sleep(0.5); if(!nextResolver) setBill(CSTORE.billMin+3); } }catch(e){} })();
  F("c_pipe","c_gw1","c_hs2"); await P("c_pipe","c_gw1",{c:"azure",label:"Hive activity"}); await P("c_gw1","c_hs2",{c:"hive",label:"SQL"});
  await P("c_hs2","c_sqlp",{c:"hive",label:"what is table 'calls'?"}); await P("c_sqlp","c_hs2",{c:"hive",label:"wasbs://…/raw/calls/"});
  await say("ADF's Hive activity comes in through the gateway to <b>HiveServer2</b> on the active head node, which asks the external metastore what the table looks like and where its files are.");
  await P("c_hs2","c_rm",{c:"yarn",label:"Tez job"}); const am=addCont("c_w1","Tez AM","am"); const ts=["c_w2","c_w3","c_w4","c_w1"].map(w=>addCont(w,"Tez task","tez"));
  F(ts,am,"c_adls"); const raw=DYN.find(i=>i.startsWith("cf_raw"));
  await all(...ts.map((t,i)=>P(raw,t,{c:"data",big:true,label:i?"":"read over the network"})));
  await say("Workers read the raw files from the storage account <b>over Azure's network</b> using wasbs:// paths (abfss:// on an ADLS Gen2 cluster), through the same Hadoop FileSystem API, so Hive doesn't care that it isn't HDFS. There's no data locality any more; fast networks make that acceptable.");
  await all(P(ts[0],ts[3],{c:"mr"}),P(ts[1],ts[3],{c:"mr"}),P(ts[2],ts[3],{c:"mr"}));
  await P(ts[3],"c_adls",{c:"mr",big:true,label:"write curated"}); addFile("cur","part-0","out"); addFile("cur","part-1","out");
  await say("Results are written straight back to the storage account, into the curated folder.");
  await P(ts[3],"c_hs2",{c:"hive",label:"done"}); await P("c_hs2","c_pipe",{c:"azure",label:"succeeded"}); [...ts,am].forEach(removeCont);
}},
{id:"cloud4", ch:"11 · Azure HDInsight", title:"Delete the cluster", world:"cloud", async run(){
  cbase({curated:true}); setBill(125); CSTORE.billS.textContent="cluster exists — billed per minute, even when idle";
  card("ttl","<h4>Idle timeToLive</h4><div class='big' id='ttl'>15 min</div>");
  F("c_adf","c_bill"); await say("The job is done, but the cluster waits for its <b>timeToLive</b> (say 15 minutes) in case another activity needs it, and the meter keeps running even though it's idle.");
  await tween(3,p=>{ document.getElementById("ttl").textContent=Math.round(15*(1-p))+" min"; setBill(125+15*p); });
  await say("Then Data Factory deletes the cluster: every VM disappears and billing stops.");
  await clusterFade(false,3); CSTORE.billS.textContent="cluster deleted — meter stopped";
  F("c_adls","c_sql"); card("sum","<h4>Compute billed</h4>≈ 2 h 20 min a day ≈ <b>70 h a month</b><br>instead of 720 h for a cluster that runs 24/7");
  await say("What survives: every file in the storage account and every table definition in the external metastore. Tomorrow at 01:00 a brand-new cluster finds everything exactly where it was.");
}},
{id:"summary", ch:"12 · Summary", title:"Who runs where", world:"onprem", async run(){
  base();
  for(const s of ["hdfs","yarn","mr","hive","hbase","kafka","zk","spark","ingest"]){
    let tmp=[];
    if(s==="mr") tmp=[addCont("w1","Map task","map"),addCont("w5","Reduce task","red"),addCont("w3","Tez task","tez")];
    if(s==="spark") tmp=[addCont("w5","Spark driver","sdrv"),addCont("w2","executor","sexec")];

 <div class="row"><svg width="46" height="28"><rect x="2" y="4" width="42" height="20" rx="5" fill="#7BD38938" stroke="#7BD389" stroke-dasharray="5 3" stroke-width="1.6"/></svg><span><b>Container</b>: temporary slice of a worker where one task runs</span></div>
 <div class="row"><svg width="46" height="28"><rect x="10" y="4" width="26" height="20" rx="4" fill="#F2A93B"/></svg><span><b>Block</b>: a piece of a file on a worker's disk</span></div>
 <div class="row"><svg width="46" height="28"><line x1="2" y1="14" x2="44" y2="14" stroke="#2E4066" stroke-width="3"/><circle cx="26" cy="14" r="5" fill="#E8EDF6"/></svg><span><b>Network</b>: dots are messages (small) and data (big) moving through the switches</span></div>`;
document.getElementById("panelBtn").onclick=e=>{ const h=document.getElementById("panel").classList.toggle("hide"); e.target.textContent=h?"Show panel":"Hide panel"; };
document.getElementById("legendBtn").onclick=()=>document.getElementById("legend").classList.toggle("show");
function setModeUI(){ document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode)); renderTimeline(); renderTag(); }
function explore(world){
  token++; mode="explore"; infoKey=null; transcript=[]; resetWorld(world||curWorld); setPaused(false);
  if(curWorld==="onprem"){ putCalls(); startHeartbeats(); [["w1","Map · B1","map"],["w4","AM","am"],["w2","Reduce 1","red"],["w5","executor","sexec"]].forEach(a=>addCont(...a)); }
  else { cbase({curated:true}); addCont("c_w1","Tez AM","am"); addCont("c_w2","Tez task","tez"); setBill(45); CSTORE.billS.textContent="cluster exists — billed per minute"; }
  capEl.innerHTML="Explore mode: click any machine, program, container, block or switch. Use the coloured buttons to light up where each system runs.";
  setModeUI(); renderPanel();
}
document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{ if(b.dataset.m==="explore") explore(); else playScene(cur); });
document.querySelectorAll("#worldSeg button").forEach(b=>b.onclick=()=>{ const w=b.dataset.w; if(mode==="explore") explore(w); else playScene(w==="cloud"?SCENE_IDX.cloud1:0); });
playBtn.onclick=()=>{ if(mode==="explore"){ playScene(cur); return; } setPaused(!paused); };
document.getElementById("prevBtn").onclick=()=>playScene(cur-1);
document.getElementById("nextBtn").onclick=()=>playScene(cur+1);
document.getElementById("speedSel").onchange=e=>speed=parseFloat(e.target.value);
document.getElementById("stepChk").onchange=e=>{ stepMode=e.target.checked; if(!stepMode && nextResolver) nextResolver(); };
capEl.onclick=()=>{ if(nextResolver) nextResolver(); };
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault(); playBtn.click(); }
  else if(e.key==="ArrowRight"){ if(nextResolver) nextResolver(); else if(e.shiftKey) playScene(cur+1); }
  else if(e.key==="n"||e.key==="N") playScene(cur+1);
  else if(e.key==="p"||e.key==="P") playScene(cur-1);
  else if(e.key==="Escape"){ infoKey=null; filterSys(null); }
});
playScene(0);
</script>
</body>
